name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Read release notes
        run: |
          version="$(bash Scripts/read-version.sh)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag must match Config/Version.xcconfig (v$version)"
            exit 1
          fi
          awk -v v="$version" '
            /^## / { if (found) exit; found = (index($0, "## " v " ") == 1 || $0 == "## " v); next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -project BaiduPCS-Swift.xcodeproj -scheme BaiduPCS-Swift \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_APP_SANDBOX=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build

      - name: Verify and package
        run: |
          app="build/Build/Products/Release/Ferry Plus.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          artifacts="$(bash Scripts/package-app.sh "$app")"
          {
            IFS= read -r archive
            IFS= read -r checksum
          } <<< "$artifacts"
          printf 'ARCHIVE_PATH=%s\nCHECKSUM_PATH=%s\n' "$archive" "$checksum" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" "$CHECKSUM_PATH" \
            --title "Ferry Plus $VERSION" --notes-file notes.md $prerelease
